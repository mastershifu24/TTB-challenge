  <text x="300" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1a1a1a">MAPLE FORK</text><text x="300" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#1a1a1a">Straight Bourbon Whiskey</text><text x="300" y="204" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#1a1a1a">43% Alc./Vol.</text><text x="300" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#1a1a1a">1 L</text>
  <text x="40" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">GOVERNMENT WARNING: (1) According to the Surgeon General,</text><text x="40" y="356" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">women should not drink alcoholic beverages during pregnancy</text><text x="40" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">because of the risk of birth defects. (2) Consumption</text><text x="40" y="388" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">of alcoholic beverages impairs your ability to drive a</text><text x="40" y="404" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">car or operate machinery, and may cause health problems.</text>
